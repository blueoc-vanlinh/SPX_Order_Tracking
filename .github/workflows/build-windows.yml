name: Build Windows app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Build clean release
        env:
          SPX_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: SPX_Order_Tracking_Windows
          path: release/SPX_Order_Tracking_Windows.zip
